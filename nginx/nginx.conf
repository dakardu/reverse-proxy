events {}

http {

    upstream backend {
        server app0:80;
        server app1:80;
        server app2:80;
    }

    ############################################################
    # NetServices - HTTP
    ############################################################

    server {

        listen 80;

        server_name netservices.abrdns.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }

    }

    ############################################################
    # NetServices - HTTPS
    ############################################################

    server {

        listen 443 ssl;
        http2 on;

        server_name netservices.abrdns.com;

        ssl_certificate     /etc/letsencrypt/live/netservices.abrdns.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netservices.abrdns.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data: https:;" always;

        location / {

            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

    }

    ############################################################
    # Portafolio - HTTP
    ############################################################

    server {

        listen 80;

        server_name portafolio.netservices.abrdns.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }

    }

    ############################################################
    # Portafolio - HTTPS
    ############################################################

    server {

        listen 443 ssl;
        http2 on;

        server_name portafolio.netservices.abrdns.com;

        ssl_certificate     /etc/letsencrypt/live/netservices.abrdns.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netservices.abrdns.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data: https:;" always;

        location / {

            proxy_pass http://portafolio-frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location /api/ {

            proxy_pass http://portafolio-backend:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

    }

}