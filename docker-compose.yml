services:
  nginx:
    image: ghcr.io/dakardu/reverse-proxy:latest
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    restart: unless-stopped

    networks:
      - proxy

    volumes:
      - ./nginx:/etc/nginx
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped

    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        cerbot renew;
        sleep 12h;
      done"

networks:
  proxy:
    name: proxy
